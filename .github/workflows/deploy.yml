name: Deploy Mari-AAtha → Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Public repo — Cloudflare connects directly via GitHub integration.
      # No CLOUDFLARE_API_TOKEN needed. Cloudflare auto-deploys on every push.
      # This workflow just triggers the deployment notification.
      - name: Notify deployment
        run: |
          echo "✅ Push to main detected."
          echo "Cloudflare Pages will auto-deploy from the connected GitHub repo."
          echo "No API token required for public repositories."
          echo "Check your deployment at: https://mari-aatha.pages.dev"
